name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            pdfium_arch: linux-x64
          - target: aarch64
            pdfium_arch: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFium
        run: |
          mkdir -p python/pdflinkcheck_rust
          # Use local variables to avoid GitHub expression interpolation issues in the shell
          ARCH="${{ matrix.pdfium_arch }}"
          URL="https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-${ARCH}.tgz"
          wget -q "$URL" -O pdfium.tgz
          tar -xzf pdfium.tgz -C python/pdflinkcheck_rust/ lib/libpdfium.so
          mv python/pdflinkcheck_rust/lib/libpdfium.so python/pdflinkcheck_rust/
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.10 python3.11 python3.12 python3.13
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFium
        shell: pwsh
        run: |
          # Create directory first
          if (!(Test-Path "python/pdflinkcheck_rust")) { New-Item -ItemType Directory -Path "python/pdflinkcheck_rust" -Force }
          
          # Use curl.exe -L to follow redirects to the actual zip
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-windows-x64.zip"
          curl.exe -L $url -o pdfium.zip
          
          Expand-Archive -Path "pdfium.zip" -DestinationPath "temp_pdfium" -Force
          Copy-Item "temp_pdfium/x64/bin/pdfium.dll" -Destination "python/pdflinkcheck_rust/pdfium.dll" -Force
  
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            pdfium_arch: mac-x64
          - target: aarch64
            pdfium_arch: mac-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFium
        run: |
          mkdir -p python/pdflinkcheck_rust
          ARCH="${{ matrix.pdfium_arch }}"
          URL="https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-${ARCH}.tgz"
          curl -L "$URL" -o pdfium.tgz
          tar -xzf pdfium.tgz -C python/pdflinkcheck_rust/ lib/libpdfium.so # or .dylib for mac
          # Note: In the actual script, ensure you move the .so/.dylib out of /lib
          mv python/pdflinkcheck_rust/lib/* python/pdflinkcheck_rust/
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.10 python3.11 python3.12 python3.13
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
