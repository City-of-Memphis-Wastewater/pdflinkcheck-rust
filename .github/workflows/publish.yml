name: Build and Publish

on:
  release:
    types: [published]
  #push:
  #   branches: [main, dev]
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            pdfium_arch: linux-x64
          - target: aarch64
            pdfium_arch: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFium
        run: |
          mkdir -p pdflinkcheck_rust
          wget https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-${{ matrix.pdfium_arch }}.tgz
          tar -xzf pdfium-${{ matrix.pdfium_arch }}.tgz -C pdflinkcheck_rust/ lib/libpdfium.so
          mv pdflinkcheck_rust/lib/libpdfium.so pdflinkcheck_rust/
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-windows-x64.zip" -OutFile "pdfium.zip"
          Expand-Archive -Path "pdfium.zip" -DestinationPath "temp_pdfium"
          if (!(Test-Path "pdflinkcheck_rust")) { New-Item -ItemType Directory -Path "pdflinkcheck_rust" }
          Copy-Item "temp_pdfium/x64/bin/pdfium.dll" -Destination "pdflinkcheck_rust/pdfium.dll"
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            pdfium_arch: mac-x64
          - target: aarch64
            pdfium_arch: mac-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFium
        run: |
          mkdir -p pdflinkcheck_rust
          wget https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-${{ matrix.pdfium_arch }}.tgz
          tar -xzf pdfium-${{ matrix.pdfium_arch }}.tgz -C pdflinkcheck_rust/ lib/libpdfium.dylib
          mv pdflinkcheck_rust/lib/libpdfium.dylib pdflinkcheck_rust/
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing
      contents: read
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
